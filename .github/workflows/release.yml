name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag version
        run: |
          package_version=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          }

      - name: Build release binaries
        run: bun run build:all

      - name: Typecheck and test
        run: |
          bun run check
          bun run build
          bun run test

      - name: Create checksums
        run: cd dist && sha256sum baton-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/baton-*
            dist/SHA256SUMS

  verify:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: baton-linux-x64
          - os: ubuntu-24.04-arm
            target: baton-linux-arm64
          - os: macos-15-intel
            target: baton-darwin-x64
          - os: macos-latest
            target: baton-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Check the actual release artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x "dist/$TARGET"
          # Match install.sh and selfUpdate on macOS after downloading the artifact.
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --force --sign - "dist/$TARGET"; fi
          bun run check:release "dist/$TARGET"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/baton-darwin-arm64
            dist/baton-darwin-x64
            dist/baton-linux-arm64
            dist/baton-linux-x64
            dist/SHA256SUMS
